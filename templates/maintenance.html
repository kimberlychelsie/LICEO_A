<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance — Liceo LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #f8fafc;
        }
        .m-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .m-icon-wrap {
            width: 88px;
            height: 88px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.75rem;
            color: #fbbf24;
            font-size: 2.25rem;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 16px rgba(245, 158, 11, 0); }
        }
        h1 { font-size: 1.85rem; font-weight: 800; color: #ffffff; margin-bottom: 0.75rem; tracking: -0.02em; }
        p { font-size: 0.975rem; color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
        .m-status {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 0.85rem 1.25rem;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 2rem;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .btn-admin {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-admin:hover { background: #1d4ed8; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="m-card">
        <div class="m-icon-wrap">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <h1>System Under Maintenance</h1>
        <p>Liceo LMS is currently undergoing scheduled system updates and security enhancements. All features will be restored shortly.</p>
        
        <div class="m-status" style="margin-bottom:0;">
            <span class="dot"></span>
            <span>Maintenance Mode Enabled — Estimated duration: ~15 mins</span>
        </div>
    </div>
</body>
</html>
