<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Liceo LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #07133a 0%, #0e2260 50%, #1a3a8f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #0f172a;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 40px 32px;
            text-align: center;
        }
        .icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon-wrap.success {
            background: #ecfdf5;
            color: #10b981;
            border: 2px solid #a7f3d0;
        }
        .icon-wrap.error {
            background: #fef2f2;
            color: #ef4444;
            border: 2px solid #fecaca;
        }
        .title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0c2461;
            margin-bottom: 12px;
        }
        .message {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-close {
            display: inline-block;
            background: #0c2461;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-close:hover {
            background: #1e3799;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap {% if success %}success{% else %}error{% endif %}">
            {% if success %}
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            {% else %}
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            {% endif %}
        </div>

        <h1 class="title">{{ title }}</h1>
        <p class="message">{{ message }}</p>

        <button onclick="window.close();" class="btn-close">Close Window</button>
    </div>
</body>
</html>
