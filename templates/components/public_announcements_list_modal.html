<style>
  .public-ann-list-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:72px 20px 20px;background:rgba(12,36,97,.68);backdrop-filter:blur(5px)}.public-ann-list-modal.show{display:flex}.public-ann-list-dialog{width:min(900px,100%);max-height:calc(100vh - 92px);display:flex;flex-direction:column;overflow:hidden;border-radius:20px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.3)}.public-ann-list-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-bottom:1px solid #e2e8f0;flex:0 0 auto}.public-ann-list-head h2{margin:0;color:#0c2461;font-family:'Playfair Display',serif;font-size:1.35rem}.public-ann-list-close{width:38px;height:38px;border:0;border-radius:50%;background:#f1f5f9;color:#334155;font-size:1.35rem;cursor:pointer}.public-ann-list-filter{padding:12px 18px;border-bottom:1px solid #e2e8f0;background:#f8fafc;flex:0 0 auto}.public-ann-list-filter label{display:block;margin-bottom:6px;color:#475569;font-size:.72rem;font-weight:800;text-transform:uppercase}.public-ann-branch-select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a;font:inherit}.public-ann-branch-select:focus{outline:2px solid rgba(37,99,235,.2);border-color:#2563eb}.public-ann-list-body{min-height:180px;overflow-y:auto;overflow-x:hidden;padding:18px}.public-ann-modal-list{display:flex;flex-direction:column;gap:12px}.public-ann-list-state{padding:44px 20px;color:#64748b;text-align:center}.public-ann-list-state.is-inline{padding:16px}.public-ann-retry{margin-top:12px;border:1px solid #d4af37;border-radius:8px;padding:9px 16px;background:#fff;color:#0c2461;font-weight:800;cursor:pointer}.public-ann-list-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid #e2e8f0;background:#fff;flex:0 0 auto}.public-ann-list-count{color:#64748b;font-size:.8rem;font-weight:700}.public-ann-list-controls{display:flex;align-items:center;gap:10px;color:#475569;font-size:.82rem;font-weight:800}.public-ann-page-button{border:1px solid #dbe3ef;border-radius:8px;padding:9px 14px;background:#fff;color:#0c2461;font-weight:800;cursor:pointer}.public-ann-page-button:disabled{color:#94a3b8;background:#f8fafc;cursor:not-allowed}.public-ann-modal-list .ann-row-card{border-radius:14px;padding:14px}.public-ann-modal-list .ann-row-img-wrap{width:88px;height:68px}@media(max-width:640px){.public-ann-list-modal{padding:68px 10px 10px}.public-ann-list-dialog{max-height:calc(100vh - 78px);border-radius:16px}.public-ann-list-head{padding:14px 16px}.public-ann-list-filter{padding:12px 18px;border-bottom:1px solid #e2e8f0;background:#f8fafc;flex:0 0 auto}.public-ann-list-filter label{display:block;margin-bottom:6px;color:#475569;font-size:.72rem;font-weight:800;text-transform:uppercase}.public-ann-branch-select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a;font:inherit}.public-ann-branch-select:focus{outline:2px solid rgba(37,99,235,.2);border-color:#2563eb}.public-ann-list-body{padding:12px}.public-ann-list-footer{align-items:stretch;flex-direction:column;padding:12px}.public-ann-list-controls{justify-content:space-between}.public-ann-page-button{flex:1}.public-ann-modal-list .ann-row-card{gap:12px;padding:12px}.public-ann-modal-list .ann-row-img-wrap{width:72px;height:62px}}
</style>
<div class="public-ann-list-modal" id="publicAnnouncementsListModal" role="dialog" aria-modal="true" aria-labelledby="publicAnnouncementsListTitle" data-url="{{ url_for('public.public_announcements_api') }}" data-fallback-image="{{ url_for('static', filename='img/spdcss_logo.webp') }}" hidden>
  <div class="public-ann-list-dialog">
    <header class="public-ann-list-head"><h2 id="publicAnnouncementsListTitle">School Announcements</h2><button type="button" class="public-ann-list-close" id="publicAnnouncementsListClose" aria-label="Close announcements">&times;</button></header>
    <div class="public-ann-list-filter"><label for="publicAnnouncementsBranch">Branch</label><select class="public-ann-branch-select" id="publicAnnouncementsBranch"><option value="">All Branches</option>{% for branch in branches %}<option value="{{ branch.branch_id }}">{{ branch.branch_name }}</option>{% endfor %}</select></div>
    <div class="public-ann-list-body" id="publicAnnouncementsListBody"><div class="public-ann-list-state" id="publicAnnouncementsListState" role="status">Loading announcements...</div><div class="public-ann-modal-list" id="publicAnnouncementsModalList"></div></div>
    <footer class="public-ann-list-footer"><div class="public-ann-list-count" id="publicAnnouncementsListCount"></div><div class="public-ann-list-controls"><button type="button" class="public-ann-page-button" id="publicAnnouncementsPrevious">Previous</button><span id="publicAnnouncementsPageLabel">Page 1 of 1</span><button type="button" class="public-ann-page-button" id="publicAnnouncementsNext">Next</button></div></footer>
  </div>
</div>
<script>
(function setupPublicAnnouncementsList(){
  const modal=document.getElementById('publicAnnouncementsListModal');
  const trigger=document.getElementById('publicAnnouncementsViewAll');
  if(!modal||!trigger)return;
  const closeButton=document.getElementById('publicAnnouncementsListClose');
  const body=document.getElementById('publicAnnouncementsListBody');
  const list=document.getElementById('publicAnnouncementsModalList');
  const state=document.getElementById('publicAnnouncementsListState');
  const count=document.getElementById('publicAnnouncementsListCount');
  const label=document.getElementById('publicAnnouncementsPageLabel');
  const previous=document.getElementById('publicAnnouncementsPrevious');
  const next=document.getElementById('publicAnnouncementsNext');
  const branch=document.getElementById('publicAnnouncementsBranch');
  let currentPage=1,loading=false,requestNumber=0,controller=null;
  const detailsOpen=()=>document.getElementById('announcementDetailsModal')?.classList.contains('show');
  const lightboxOpen=()=>document.getElementById('hpLB')?.classList.contains('active');
  function syncScroll(){document.body.style.overflow=modal.classList.contains('show')||detailsOpen()||lightboxOpen()?'hidden':''}
  function setControls(disabled,data){previous.disabled=disabled||!data||!data.has_previous;next.disabled=disabled||!data||!data.has_next}
  function showState(text,retry=false){state.replaceChildren();state.hidden=false;state.classList.toggle('is-inline',list.children.length>0);const box=document.createElement('div');box.textContent=text;if(retry){const button=document.createElement('button');button.type='button';button.className='public-ann-retry';button.textContent='Retry';button.addEventListener('click',()=>loadPage(currentPage));box.append(document.createElement('br'),button)}state.append(box)}
  function makeCard(item){const card=document.createElement('article');card.className='ann-row-card js-announcement-card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','View announcement: '+(item.title||'Announcement'));card.dataset.hasImage=item.image_url?'true':'false';const imageWrap=document.createElement('div');imageWrap.className='ann-row-img-wrap';const image=document.createElement('img');image.src=item.image_url||modal.dataset.fallbackImage;image.alt=item.title||'Announcement';image.loading='lazy';const overlay=document.createElement('div');overlay.className='ann-img-overlay';overlay.setAttribute('aria-hidden','true');overlay.innerHTML='<i class="fas fa-eye"></i>';imageWrap.append(image,overlay);const content=document.createElement('div');content.className='ann-row-content';const title=document.createElement('h3');title.textContent=item.title||'Announcement';content.append(title);if(item.published_at||item.source){const meta=document.createElement('div');meta.className='ann-row-meta';if(item.published_at){const time=document.createElement('time');time.className='js-announcement-date';time.textContent=item.published_at;if(item.created_at)time.dateTime=item.created_at;meta.append(time)}if(item.source){const source=document.createElement('span');source.className='ann-row-source js-announcement-source';source.textContent=item.source;meta.append(source)}content.append(meta)}const message=document.createElement('p');message.textContent=item.message||'No description provided.';content.append(message);card.append(imageWrap,content);return card}
  function render(data){const fragment=document.createDocumentFragment();data.announcements.forEach(item=>fragment.append(makeCard(item)));list.replaceChildren(fragment);state.hidden=data.total!==0;if(!data.total)showState('No public announcements are available yet.');currentPage=data.page;const start=data.total?(data.page-1)*data.per_page+1:0;const end=data.total?start+data.announcements.length-1:0;count.textContent=data.total?'Showing '+start+'-'+end+' of '+data.total+' announcements':'Showing 0 announcements';label.textContent='Page '+data.page+' of '+Math.max(data.total_pages,1);setControls(false,data);body.scrollTop=0}
  async function loadPage(page){if(controller)controller.abort();const number=++requestNumber;controller=new AbortController();loading=true;setControls(true);if(!list.children.length)showState('Loading announcements...');try{const url=new URL(modal.dataset.url,location.origin);url.searchParams.set('page',Math.max(1,page));if(branch.value)url.searchParams.set('branch_id',branch.value);const response=await fetch(url,{headers:{Accept:'application/json'},credentials:'same-origin',signal:controller.signal});if(!response.ok)throw new Error('Request failed');const data=await response.json();if(number!==requestNumber)return;render(data)}catch(error){if(error.name==='AbortError'||number!==requestNumber)return;showState('Announcements could not be loaded. Please try again.',true);setControls(false)}finally{if(number===requestNumber){loading=false;controller=null}}}
  function openList(event){event.preventDefault();currentPage=1;list.replaceChildren();modal.hidden=false;modal.classList.add('show');syncScroll();closeButton.focus();loadPage(1)}
  function closeList(){requestNumber++;controller?.abort();controller=null;loading=false;modal.classList.remove('show');modal.hidden=true;syncScroll();trigger.focus()}
  trigger.addEventListener('click',openList);branch.addEventListener('change',()=>{currentPage=1;list.replaceChildren();loadPage(1)});previous.addEventListener('click',()=>{if(!loading&&currentPage>1)loadPage(currentPage-1)});next.addEventListener('click',()=>{if(!loading)loadPage(currentPage+1)});closeButton.addEventListener('click',closeList);modal.addEventListener('click',event=>{if(event.target===modal)closeList()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.classList.contains('show')&&!detailsOpen()&&!lightboxOpen())closeList()});
})();
</script>
